name: Deploy Azure Function

on:
  pull_request:
    branches:
      - main
    paths:
      - infra/**
      - config-generated/**
      - function_app/**
      - .github/workflows/deploy.yml
  push:
    branches:
      - main
    paths:
      - infra/**
      - config-generated/**
      - function_app/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-${{ '${{ github.workflow }}' }}-${{ '${{ github.ref }}' }}
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ '${{ secrets.AZURE_CLIENT_ID }}' }}
  ARM_TENANT_ID: ${{ '${{ secrets.AZURE_TENANT_ID }}' }}
  ARM_SUBSCRIPTION_ID: ${{ '${{ secrets.AZURE_SUBSCRIPTION_ID }}' }}
  TF_STATE_RESOURCE_GROUP: ${{ '${{ vars.TF_STATE_RESOURCE_GROUP }}' }}
  TF_STATE_STORAGE_ACCOUNT: ${{ '${{ vars.TF_STATE_STORAGE_ACCOUNT }}' }}
  TF_STATE_CONTAINER: ${{ '${{ vars.TF_STATE_CONTAINER }}' }}
  TF_VAR_config_environment: ${{ values.environment | dump }}
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  deploy:
    name: Terraform and Function deployment
    if: vars.TF_STATE_RESOURCE_GROUP != '' && vars.TF_STATE_STORAGE_ACCOUNT != '' && vars.TF_STATE_CONTAINER != ''
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ '${{ env.ARM_CLIENT_ID }}' }}
          tenant-id: ${{ '${{ env.ARM_TENANT_ID }}' }}
          subscription-id: ${{ '${{ env.ARM_SUBSCRIPTION_ID }}' }}

      - name: Check Terraform formatting
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: infra
        run: |
          terraform init \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=${{ values.name }}-${{ values.environment }}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Validate Terraform
        working-directory: infra
        run: terraform validate

      - name: Create Terraform plan
        working-directory: infra
        run: terraform plan -lock-timeout=5m -out=deployment.tfplan

      - name: Apply Terraform plan
        if: github.event_name != 'pull_request'
        working-directory: infra
        run: terraform apply -auto-approve deployment.tfplan

      - name: Read Function App name
        if: github.event_name != 'pull_request'
        id: terraform-output
        working-directory: infra
        run: echo "function_app_name=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"

      - name: Deploy function code
        if: github.event_name != 'pull_request'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ '${{ steps.terraform-output.outputs.function_app_name }}' }}
          package: function_app
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Show endpoint
        if: github.event_name != 'pull_request'
        working-directory: infra
        run: terraform output function_url
