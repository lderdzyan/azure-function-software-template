name: Publish TechDocs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'

jobs:
  publish-techdocs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install MkDocs & TechDocs Core
        run: |
          pip install mkdocs-techdocs-core

      - name: Generate TechDocs Site
        run: |
          techdocs-cli generate --verbose

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.CLIENT_CREDS }}

      - name: Publish TechDocs to Azure Blob Storage
        run: |
          techdocs-cli publish \
            --publisher-type azureBlobStorage \
            --storage-name ${{ vars.TF_STATE_STORAGE_ACCOUNT }} \
            --entity default/component/${{ github.event.repository.name }}